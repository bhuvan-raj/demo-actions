
name: CI with AWS SES Email (OIDC)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Debug GitHub OIDC claims
      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          export TOKEN

          python3 -c '
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub")
          }, indent=2))
          '

      # Configure AWS credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::714386598343:role/sesdemorole
          aws-region: ap-south-1

      # Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Run build
        run: |
          echo "Simulating a build process..."
          # exit 1

      # Send success email
      - name: Send Email Notification (on success)
        if: success()
        run: |
          aws ses send-email \
            --from 'bhuvanraj107123@gmail.com' \
            --destination 'ToAddresses="bhuvanraj-k@proton.me"' \
            --message 'Subject={Data="Build Success - ${{ github.repository }}"},Body={Text={Data="Build for ${{ github.repository }} on branch ${{ github.ref_name }} was successful!\n\nCommit: ${{ github.sha }}\nWorkflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}' \
            --region ap-south-1

      # Send failure email
      - name: Send Email Notification (on failure)
        if: failure()
        run: |
          aws ses send-email \
            --from 'bhuvanraj107123@gmail.com' \
            --destination 'ToAddresses="ToAddresses=bhuvanraj-k@proton.me"' \
            --message 'Subject={Data="Build FAILED - ${{ github.repository }}"},Body={Text={Data="ALERT: Build for ${{ github.repository }} on branch ${{ github.ref_name }} FAILED!\n\nCommit: ${{ github.sha }}\nPlease review logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}' \
            --region ap-south-1
